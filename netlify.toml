[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Shop temporarily hidden
[[redirects]]
  from = "/shop"
  to = "/"
  status = 302

[[redirects]]
  from = "/shop.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/product.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/cart.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/checkout.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/track-order.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/order.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/invoice.html"
  to = "/"
  status = 302

[dev]
  framework = "#static"
  port = 8888
  # Edge Functions not used — if `npm run dev:netlify` fails on Deno download,
  # use `npm run dev` instead (scripts/dev-server.mjs)
