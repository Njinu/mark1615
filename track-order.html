<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Track Order - Mark 1615 Shop</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="img/favicon.ico" rel="icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/shop.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid fixed-top px-0">
        <nav class="navbar navbar-expand-lg navbar-dark py-lg-0 px-lg-5">
            <a href="index.html" class="navbar-brand ms-4"><h1 class="fw-bold text-primary m-0">Mark<span class="text-white">1615</span></h1></a>
            <div class="navbar-nav ms-auto p-4">
                <a href="shop.html" class="nav-item nav-link">Shop</a>
                <a href="track-order.html" class="nav-item nav-link active">Track order</a>
            </div>
        </nav>
    </div>
    <div class="container-fluid page-header mb-5">
        <div class="container text-center"><h1 class="display-4 text-white mb-4">Track Your Order</h1></div>
    </div>
    <div class="container-xxl py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-6">
                    <div id="shop-alert" class="mb-4"></div>
                    <form id="track-order-form" class="bg-light rounded p-4 mb-5">
                        <div class="mb-3">
                            <label class="form-label" for="track-ref">Order reference</label>
                            <input type="text" class="form-control" id="track-ref" placeholder="e.g. M1615-20260706-K7M2" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="track-email">Email address</label>
                            <input type="email" class="form-control" id="track-email" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3">Track order</button>
                    </form>
                </div>
            </div>
            <div id="track-order-result"></div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="js/main.js"></script>
    <script type="module">
        import './js/shop/init.js';
        import { initTrackOrderPage } from './js/shop/orders.js';
        document.addEventListener('DOMContentLoaded', initTrackOrderPage);
    </script>
</body>
</html>
